# =============================================================
# Plickers School Response System — Docker Compose
# =============================================================
# Usage:
#   cp .env.example .env      # fill in real secrets
#   docker compose up -d
#   docker compose exec backend python scripts/seed.py   # dev seed
#
# Swagger UI: http://localhost:8000/docs
# pgAdmin:    http://localhost:5050  (dev only)
# =============================================================

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # PostgreSQL is NOT exposed to the host network in production.
    # Uncomment the lines below ONLY for local development inspection.
    # ports:
    #   - "5432:5432"
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - backend_net
    volumes:
      - ./uploads:/app/uploads
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
      "

  # ── pgAdmin (OPTIONAL — development only) ────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    profiles:
      - dev              # only starts with: docker compose --profile dev up
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    networks:
      - backend_net
    volumes:
      - pgadmin_data:/var/lib/pgadmin


volumes:
  postgres_data:       # persists database across container restarts
  pgadmin_data:


networks:
  backend_net:
    driver: bridge
    # PostgreSQL only reachable within this network — not on host
